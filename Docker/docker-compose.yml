services:
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17
    container_name: so3ban
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: Elmon
      POSTGRES_PASSWORD: Elmon123
      POSTGRES_DB: E-commerce
    
    restart : always
volumes:
  pgvector_data:


    